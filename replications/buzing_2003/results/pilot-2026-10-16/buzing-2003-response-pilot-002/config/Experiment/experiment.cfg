useGui = false
numberOfRuns = 1
autoStart               =true

#data will be saved as ./[dataDir]/[dataFile]_[run]_[dataAttribute].[type]
#example: ./data/experiment_0_numberOfAgents.avg
#the dataFile param is actually a prefix
dataFile                =experiment
dataDir                 =data

#do not give any information on standard output
silent                  =false

# interval in milliseconds between update on standard output
cmdLineInterval         =5000

cmdLineInformation      =sugarAmount, 1, vision, 1, numberOfAgents, 1

displayProperties       =false
saveProperties          =true
askConfirmation         =false




# Following properties were added in version 2.0 to make subcycle-based execution possible.

# How many subcycles are used per iteration. The execution of agent rules is
# done using subcycles to achieve virtual parallelism. The following settings
# make sure that during each iteration, all agents move before any agent does
# anything to change the environment or the messageboard.
nrOfSubcycles = 1

# How many agent rules are executed in each subcycle.
subcycle1                               =3
subcycle2                               =4




# Following property was added in version 2.0 to choose the communication protocol used.
# if protocol = newscast, newscast is used, in all other cases messageboard will be used (for now).
#protocol                               =newscast


# Following property was added in version 2.0 One can set which scape to use.
scapeClass = nl.vu.cs.sugarland.model.SugarScape
runLength = 500
