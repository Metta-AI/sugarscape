width                   =50
height                  =50
initialPopulation       =1000
sugarRichness = 1.0f
sugarGrowBackRate       =1.0f
cellClass               =nl.vu.cs.sugarland.model.SugarCell

agentClass              =nl.vu.cs.sugarland.model.SugarAgent

rule1                   =nl.vu.cs.sugarland.model.rules.RedistributionRule

# extra population control parameters
#minPopulation           =100
#maxPopulation           =500

#for age this can be set to 10. For vision 100 is sufficient
saveBinsInterval        =100

#is sugar reseeded when eaten?
reseedSugar             =true
#should sugar be reseeded after the end of the iteration or immediatly?
reseedPerIteration      =true

#Allow max one sugar seed on a cell at initialization (default false)
sugarSeed.uniqueInitCell   =false
#Allow max one sugar seed when redistributing (default false)
sugarSeed.uniqueCell       =false

# the properties we want to monitor
# the type can be 1 for avg, 2 for min, 4 for max, 8 for sum, 16 for var
# 32 for SD or any combination (eg 1+32)
monitor1                =numberOfAgents
monitortype1            =1

monitor2                =numberOfBirths
monitortype2            =1
monitor3                =numberOfDeaths
monitortype3            =1

# maximum size per seed
maxSugarSize          =4

# sugar distribution type
# uniform or 2hills
sugarDistributionType =uniform

# if a uniform distribution is chosen there are three options:

# Option 1: amount of sugar is sugar richness * number of cells, as long as there is more
# sugar to distribute a new seed is created with size randomly between 1 and maxSugarSize
sugarDistributionUnif   =1

# Option 2: amount of sugar is sugar richness * number of cells, each sugar unit is added
# to a random seed (if it is not already at maxSugarSize)
#sugarDistributionUnif   =2

# Option 3: number of seeds equals numberOfSeeds (1000 by default), each seeds size is
# a random number between 1 and maxSugarSize, so the total amount of sugar will be
# approximately ((1 + maxSugarSize) / 2) * numberOfSeeds.
#sugarDistributionUnif   =3
numberOfSeeds 			=1000

# sugar random distribution when Distribution type is uniform
# 0.0 is all evenly 1.0, 1.0 means completely random (same as commenting it)
# randomNessSugar    =1.0f

# should the messages be removed after n iterations (0 means no time limit)
message.removeAfterNIterations = 0
# should the message be removed after just listening
message.removeAfterListening = false
# a message is always removed when the hearer responds to it
message.removeAfterResponse = true
randomSeed = 0
