name                    =SugarAgent
minVision               =1
maxVision               =1
minSugarMetabolism      =1
maxSugarMetabolism      =1
minInitialSugar = 0
maxInitialSugar         =100
minReproductionSugar    =0
maxReproductionSugar = 0
minDeathAge             =60
maxDeathAge             =100
singleStep              =false
allowSex                =true
replacement             =false
minBeginChildBearingAge =12
maxBeginChildBearingAge =15
minEndChildBearingAgeFemales =40
maxEndChildBearingAgeFemales =50
minEndChildBearingAgeMales   =50
maxEndChildBearingAgeMales   =60

sexRecoveryPeriod            =0
minListenPref                = 0.0f
maxListenPref                = 1.0f
minTalkPref                  = 0.0f
maxTalkPref                  = 1.0f

# If this is true, then all agents start with age=0 at initialization.
# Setting this option to false can avoid the typical birth explosians...
initAgeZero                  =false

# Do you want to keep track of all the movements?
keepCellHistory              =false

# if true, the agent has a bias for close by cells
preferNearestCell            =false

# a value of 3 means that an agent can only harvest up to 3 units.
# if it is set to 10000 or so, he will not have this handicap
maxSugarHarvest = 1

# should the agent correct the sugaramount when it knows that it can't eat all
useCorrection              =false

# the rules that the agent must obey
# the ordering is crucial, i.e. it influences behaviour greatly!
rule1                   =nl.vu.cs.sugarland.model.rules.DeathRule
rule2                   =nl.vu.cs.sugarland.model.rules.ListenRule
rule3                   =nl.vu.cs.sugarland.model.rules.MoveRule
rule4                   =nl.vu.cs.sugarland.model.rules.HarvestRule
rule5                   =nl.vu.cs.sugarland.model.rules.TalkRule
rule6                   =nl.vu.cs.sugarland.model.rules.MetabolizeRule
rule7                   =nl.vu.cs.sugarland.model.rules.ReproduceRule
# rule8                   =nl.vu.cs.sugarland.model.rules.ShuffleRule


# the properties we want to monitor
# the type can be 1 for avg, 2 for min, 4 for max, 8 for sum, 16 for var
# 32 for SD , 64 for bin or any combination (eg 33 (=1+32))
#monitor1                =vision
#monitortype1            =65
#monitor2                =age
#monitortype2            =1

monitor2                =listenPref
monitortype2            =65
monitor3                =talkPref
monitortype3            =65

#monitor4                =sugarAmount
#monitortype4            =1

monitor7                =inNeedOfHelp
monitortype7            =1
#monitor8                =exploreCell
#monitortype8            =1
#monitor9                =hasEaten
#monitortype9            =1
monitor10               =cooperating
monitortype10           =9

# use mutation? And if so, with this sigma (SD of Gaussian distribution)
mutationOperator.listenPref = true
mutationOperator.talkPref = true
mutationSigma = 0.1

# either "biggestParent" or "average"
crossOverOperator.listenPref     =biggestParent
crossOverOperator.talkPref       =biggestParent
#
needInvitation          =false
